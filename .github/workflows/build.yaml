name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release tag
        if: github.event_name == 'push'
        id: release
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive (unsigned)
        if: steps.release.outputs.skip != 'true'
        run: |
          xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release \
            archive -archivePath build/Stats.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload unsigned app
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Stats-unsigned
          path: build/Stats.xcarchive/Products/Applications/Secure Stats.app
